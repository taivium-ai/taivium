name: Security Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety bandit detect-secrets pip-licenses

      # 1. Dependency Audit with pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: |
          echo "=== Checking for known CVEs in dependencies ==="
          pip-audit --desc || true

      # 2. Code Security with Bandit
      - name: Run Bandit SAST
        continue-on-error: true
        run: |
          echo "=== Static Application Security Testing ==="
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt || true

      # 3. Secrets Detection
      - name: Run detect-secrets
        continue-on-error: true
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          detect-secrets scan src/ --json || echo "Scan completed"

      # 4. License Audit
      - name: License Audit
        continue-on-error: true
        run: |
          echo "=== Checking for problematic licenses ==="
          pip-licenses --format=plain
          echo "Checking for GPL/AGPL licenses..."
          pip-licenses --format=plain | grep -E "GPL|AGPL|SSPL" || echo "✅ No GPL/AGPL/SSPL found"

      # 5. Upload Bandit report
      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      # 6. GitHub Security Dashboard
      - name: SARIF Upload (GitHub Code Scanning)
        if: always()
        continue-on-error: true
        run: |
          # Bandit can output SARIF for GitHub Code Scanning
          bandit -r src/ -f sarif -o bandit-sarif.sarif || true

      - name: Check SARIF output exists
        if: always()
        id: sarif_check
        shell: bash
        run: |
          if [ -f bandit-sarif.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bandit-sarif.sarif not generated; skipping upload."
          fi

      - name: Upload SARIF to GitHub Security
        if: always() && steps.sarif_check.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-sarif.sarif
          category: bandit
